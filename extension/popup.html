<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmallVerse Recorder</title><link rel="stylesheet" href="style.css"></head>
<body class="popup"><main>
<header class="row between"><h1>Mission recorder</h1><span class="version">0.6</span></header>
<div class="status-line" aria-live="polite"><strong id="status">Loading…</strong><small id="message"></small></div>
<section id="new"><label for="name">New recording</label><div class="input-row"><input id="name" maxlength="120" placeholder="Mission name"><button id="record" class="primary">Record</button></div></section>
<section id="replay"><label for="saved">Saved mission</label><select id="saved"></select><label class="check"><input type="checkbox" id="ready">Starting position, zoom and mission state match.</label><div class="row"><button id="play" class="primary">Replay</button><button id="pause">Pause / Resume</button><button id="stop">Stop</button></div></section>
<div class="timing-line"><span>Minimum mission time</span><strong>3:00</strong></div>
<small>Replay holds before the marked finishing action. Set the timer markers in Review.</small>
<button id="coordinates" hidden>Use recorded position once</button>
<p id="error" role="alert"></p><footer class="row between"><a href="library.html" target="_blank">Mission library</a><span>Esc to stop</span></footer>
<script type="module" src="popup.js"></script></main></body></html>
